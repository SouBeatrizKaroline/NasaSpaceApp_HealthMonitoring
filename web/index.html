<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142f35"><title>Crew Health Check · Mission workspace</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css">
<script defer src="i18n.js"></script><script defer src="ui-text.js"></script><script defer src="core.js"></script><script defer src="planner-core.js"></script><script defer src="app.js"></script><script defer src="planning.js"></script></head>
<body>
<a class="skip-link" href="#pageTitle" data-i18n="skip"></a>
<aside class="sidebar">
  <a class="brand" href="#today"><img src="favicon.svg" alt="" width="40" height="40"><span>Crew Health<span class="brand-sub">CHECK</span></span></a>
  <nav aria-label="Main navigation">
    <a href="#today" data-page="today"><span aria-hidden="true">◉</span><span data-i18n="today"></span></a>
    <a href="#checkin" data-page="checkin"><span aria-hidden="true">＋</span><span data-i18n="checkin"></span></a>
    <a href="#history" data-page="history"><span aria-hidden="true">▤</span><span data-i18n="history"></span></a>
    <a href="#ground" data-page="ground"><span aria-hidden="true">⇩</span><span data-i18n="ground"></span></a>
    <a href="#planning" data-page="planning"><span aria-hidden="true">◇</span><span data-i18n="planning"></span></a>
  </nav>
  <div class="sidebar-foot"><p data-i18n="independent"></p><p id="sideCrew"></p></div>
</aside>
<div class="app-shell">
<header class="topbar"><div class="network"><span id="connection"></span><small id="offlineReady" role="status"></small></div><label class="language"><span data-i18n="language"></span><select id="language"><option value="en">English</option><option value="pt">Português</option><option value="es">Español</option><option value="fr">Français</option></select></label></header>
<main id="main">
  <div class="page-heading"><div><p class="eyebrow">CREW HEALTH CHECK</p><h1 id="pageTitle" tabindex="-1">Today</h1></div><span id="scopePill" class="pill" hidden></span></div>
  <p id="globalError" class="notice error" role="alert" hidden></p>
  <section id="page-today" class="page">
    <div id="profileGate" class="welcome">
      <div class="welcome-copy"><p class="eyebrow" data-i18n="context"></p><h2 data-i18n="welcome"></h2><p data-i18n="intro"></p><div class="stage-track"><span data-i18n="pre"></span><span data-i18n="during"></span><span data-i18n="post"></span></div></div>
      <form id="profileForm" class="card"><h2 data-i18n="profileTitle"></h2>
        <label><span>Crew ID</span><input id="crewId" autocomplete="off" maxlength="24" required pattern="[A-Za-z0-9][A-Za-z0-9\-]{0,23}" placeholder="CRW-01"></label>
        <label><span data-i18n="missionCode"></span><input id="initialMission" autocomplete="off" maxlength="24" pattern="[A-Za-z0-9][A-Za-z0-9\-]{0,23}" placeholder="MISSION-01"></label>
        <p class="hint" data-i18n="profileLimit"></p><button class="primary" type="submit" data-i18n="open"></button>
      </form>
    </div>
    <div id="todayWorkspace" hidden>
      <div class="today-hero card"><div><p class="eyebrow" data-i18n="missionActive"></p><h2 id="todayMission"></h2><p id="todayContext"></p><button id="startCheckin" class="primary" type="button"></button><p id="todayDraft" class="hint"></p></div><div class="mission-orbit" aria-hidden="true"><div class="orbit-line"></div><div class="orbit-center">CH</div><span class="orbit-point"></span></div></div>
      <div class="stat-grid">
        <article class="card"><p class="eyebrow">Crew ID</p><h3 id="todayCrew"></h3><button type="button" class="text-button" id="switchCrew" data-i18n="switch"></button></article>
        <article class="card"><p class="eyebrow" data-i18n="day"></p><h3 id="todayDay"></h3><p id="todayStage"></p></article>
        <article class="card"><p class="eyebrow" data-i18n="lastEntry"></p><h3 id="todayLast"></h3><a href="#history" data-i18n="viewHistory"></a></article>
      </div>
      <form class="card mission-form" id="missionForm"><label><span data-i18n="missionActive"></span><input id="missionChoice" list="knownMissions" required maxlength="24" pattern="[A-Za-z0-9][A-Za-z0-9\-]{0,23}" autocomplete="off"><datalist id="knownMissions"></datalist></label><button class="secondary" data-i18n="openMission"></button></form>
      <div class="two-grid"><a href="#ground" class="card action-card"><span class="eyebrow" data-i18n="ground"></span><h3 data-i18n="groundLabel"></h3><span aria-hidden="true">↗</span></a><a href="#planning" class="card action-card"><span class="eyebrow" data-i18n="planning"></span><h3 data-i18n="planLabel"></h3><span aria-hidden="true">↗</span></a></div>
      <p class="hint" data-i18n="profileLimit"></p>
    </div>
    <div id="legacyNotice" class="notice" hidden><p data-i18n="legacyNotice"></p><button id="legacyExport" type="button" class="secondary" data-i18n="legacyExport"></button></div>
  </section>
  <section id="page-checkin" class="page" hidden>
    <div id="checkinGate" class="empty card"><p data-i18n="profileRequired"></p><a href="#today" data-i18n="today"></a></div>
    <div id="checkinWorkspace" hidden>
      <div id="saveSuccess" class="notice success" role="status" hidden><strong data-i18n="savedOnboard"></strong><p data-i18n="savedHelp"></p><a href="#history" data-i18n="openSaved"></a></div>
      <div id="wizardProgress" class="progress" aria-label="Check-in progress"></div>
      <form id="checkinForm" class="card" novalidate><h2 id="stepTitle" tabindex="-1"></h2><div id="wizardFields"></div><p id="formMessage" class="notice error" role="alert" hidden></p><div class="form-actions"><button id="previousStep" class="secondary" type="button" data-i18n="back"></button><button id="nextStep" class="primary" type="submit" data-i18n="next"></button></div></form>
      <div class="draft-bar"><p id="draftStatus" role="status"></p><button type="button" id="discardDraft" class="text-button" data-i18n="clearDraft"></button></div>
    </div>
  </section>
  <section id="page-history" class="page" hidden>
    <div id="historyGate" class="empty card"><p data-i18n="profileRequired"></p><a href="#today" data-i18n="today"></a></div>
    <div id="historyWorkspace" hidden>
      <div class="toolbar card"><label><span data-i18n="missionActive"></span><select id="historyMission"></select></label><div><span id="exportState" class="pill"></span><button id="exportReport" class="primary" type="button" data-i18n="exportReport"></button></div></div>
      <p class="hint" data-i18n="exportHelp"></p><div id="historyComparison"></div><h2 data-i18n="allEntries"></h2><div id="historyRecords"></div>
      <details class="card research"><summary data-i18n="research"></summary><p data-i18n="researchHelp"></p><div id="researchTable"></div><a href="https://pubmed.ncbi.nlm.nih.gov/25127232/" rel="noreferrer">Barger et al. (2014) · PMID 25127232</a></details>
    </div>
  </section>
  <section id="page-ground" class="page" hidden>
    <div class="card import-card"><div><p class="eyebrow" data-i18n="ground"></p><h2 data-i18n="groundLabel"></h2><p data-i18n="groundIntro"></p></div><label class="file-label"><span data-i18n="chooseReport"></span><input id="groundFile" type="file" accept=".json,application/json"></label><p class="hint" data-i18n="groundLocal"></p><p id="importMessage" role="status"></p></div>
    <div id="groundEmpty" class="empty card"><p data-i18n="importEmpty"></p></div>
    <div id="groundReport" hidden><div class="toolbar"><h2 id="groundScope"></h2><button id="closeReport" class="secondary" data-i18n="clearReview" type="button"></button></div><div id="groundComparison"></div><h2 data-i18n="allEntries"></h2><div id="groundRecords"></div></div>
  </section>
  <section id="page-planning" class="page" hidden><div id="planningMount"></div></section>
  <footer data-i18n="independent"></footer>
</main></div>
<div id="toast" role="status" class="toast" hidden></div>
</body></html>
